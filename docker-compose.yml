services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://eve:eve@db:5432/eve
      JWT_SECRET: change-me
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
